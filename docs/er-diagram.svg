<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="960" viewBox="0 0 1120 960" role="img" aria-labelledby="title desc">
<title id="title">Reserve entity relationship diagram</title><desc id="desc">Users organize reservations and have sessions. Resources have reservations. Users optionally cancel reservations. Login attempts have no user foreign key.</desc>
<defs><style>text{font-family:Arial,sans-serif;fill:#20332e}.heading{font-size:20px;font-weight:bold}.field{font-family:monospace;font-size:14px}.label{font-size:13px}.box{fill:white;stroke:#789184;stroke-width:1.5}.line{fill:none;stroke:#486c5a;stroke-width:2}.title{font-size:28px;font-weight:bold}</style></defs>
<rect width="1120" height="960" fill="#f6f8f5"/><text x="40" y="48" class="title">Reserve · Database relationships</text><text x="40" y="75" class="label">PK = primary key · FK = foreign key · UK = unique · All timestamps use timestamptz</text>
<rect class="box" x="40" y="120" width="310" height="245" rx="6"/><path d="M40 165H350" class="line"/><text x="58" y="149" class="heading">USERS</text>
<text x="58" y="190" class="field"><tspan x="58">id                 uuid PK</tspan><tspan x="58" dy="25">name               varchar</tspan><tspan x="58" dy="25">email              varchar UK</tspan><tspan x="58" dy="25">password_hash      text</tspan><tspan x="58" dy="25">role               text</tspan><tspan x="58" dy="25">created_at         timestamptz</tspan></text>
<rect class="box" x="760" y="120" width="320" height="195" rx="6"/><path d="M760 165H1080" class="line"/><text x="778" y="149" class="heading">SESSIONS</text><text x="778" y="190" class="field"><tspan x="778">token_hash         text PK</tspan><tspan x="778" dy="25">user_id            uuid FK</tspan><tspan x="778" dy="25">expires_at         timestamptz</tspan><tspan x="778" dy="25">created_at         timestamptz</tspan></text>
<path d="M350 210H760 M367 200V220 M740 210l20 -10 M740 210l20 10" class="line"/><circle cx="730" cy="210" r="4" fill="#f6f8f5" stroke="#486c5a"/><text x="380" y="193" class="label">1 user → 0..many sessions</text>
<rect class="box" x="40" y="455" width="310" height="320" rx="6"/><path d="M40 500H350" class="line"/><text x="58" y="484" class="heading">RESOURCES</text><text x="58" y="525" class="field"><tspan x="58">id                 uuid PK</tspan><tspan x="58" dy="25">name               varchar</tspan><tspan x="58" dy="25">category           text</tspan><tspan x="58" dy="25">location           varchar</tspan><tspan x="58" dy="25">capacity           integer</tspan><tspan x="58" dy="25">description        varchar</tspan><tspan x="58" dy="25">archived_at        timestamptz?</tspan><tspan x="58" dy="25">created_at         timestamptz</tspan><tspan x="58" dy="25">updated_at         timestamptz</tspan></text>
<rect class="box" x="650" y="420" width="430" height="385" rx="6"/><path d="M650 465H1080" class="line"/><text x="668" y="449" class="heading">RESERVATIONS</text><text x="668" y="490" class="field"><tspan x="668">id                       uuid PK</tspan><tspan x="668" dy="25">resource_id              uuid FK</tspan><tspan x="668" dy="25">user_id                  uuid FK</tspan><tspan x="668" dy="25">title                    varchar</tspan><tspan x="668" dy="25">notes                    varchar</tspan><tspan x="668" dy="25">starts_at                timestamptz</tspan><tspan x="668" dy="25">ends_at                  timestamptz</tspan><tspan x="668" dy="25">attendees                integer</tspan><tspan x="668" dy="25">cancelled_at             timestamptz?</tspan><tspan x="668" dy="25">cancelled_by             uuid FK?</tspan><tspan x="668" dy="25">created_at               timestamptz</tspan><tspan x="668" dy="25">updated_at               timestamptz</tspan></text>
<path d="M350 520H650 M367 510V530 M630 520l20 -10 M630 520l20 10" class="line"/><circle cx="620" cy="520" r="4" fill="#f6f8f5" stroke="#486c5a"/><text x="377" y="500" class="label">1 resource → 0..many bookings</text>
<path d="M350 280H480V545H650 M367 270V290 M630 545l20 -10 M630 545l20 10" class="line"/><circle cx="620" cy="545" r="4" fill="#f6f8f5" stroke="#486c5a"/><text x="385" y="265" class="label">Organizer</text><text x="488" y="385" class="label">1 → 0..many</text>
<path d="M350 330H560V715H650 M367 320V340 M630 715l20 -10 M630 715l20 10" class="line" stroke-dasharray="5 4"/><circle cx="380" cy="330" r="4" fill="#f6f8f5" stroke="#486c5a"/><circle cx="620" cy="715" r="4" fill="#f6f8f5" stroke="#486c5a"/><text x="386" y="317" class="label">Cancelled by (optional)</text><text x="565" y="690" class="label">0..1 → 0..many</text>
<rect class="box" x="40" y="815" width="440" height="125" rx="6"/><text x="58" y="844" class="heading">LOGIN_ATTEMPTS</text><text x="58" y="868" class="field"><tspan x="58">email                    varchar PK</tspan><tspan x="58" dy="22">attempts                 integer</tspan><tspan x="58" dy="22">window_started_at        timestamptz</tspan></text><text x="515" y="858" class="label">No overlap for active bookings on the same resource.</text><text x="515" y="883" class="label">Time ranges are [start, end); adjacent bookings are allowed.</text><text x="515" y="908" class="label">Cancellation and archiving retain historical records.</text>
</svg>
